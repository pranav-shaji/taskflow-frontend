<app-task-form (taskCreated)="addTaskToList($event)"></app-task-form>
<app-task-search (searchChanged)="filterTasks($event)"></app-task-search>

<h1 class="page-title">Tasks</h1>

<div *ngIf="tasks.length === 0" class="empty">
  No tasks yet. Add one!
</div>

<div class="task-grid">

  @for (task of filteredTasks; track task.id) {

    <div class="task-card" [class.completed]="task.isCompleted">

      @if (editingTaskId === task.id) {

        <!-- EDIT MODE -->
        <div class="edit-section">
          <input [(ngModel)]="editTitle" placeholder="Title" />
          <textarea [(ngModel)]="editDescription" placeholder="Description"></textarea>

          <div class="task-actions">
            <button class="success" (click)="saveEdit(task)">
              Save
            </button>

            <button class="secondary" (click)="cancelEdit()">
              Cancel
            </button>
          </div>
        </div>

      } @else {

        <!-- NORMAL VIEW MODE -->
        <div class="task-content">
          <h3 [innerHTML]="highlightText(task.title)"></h3>
          <p [innerHTML]="highlightText(task.description)"></p>
        </div>

        <div class="task-actions">

          <button class="success"
                  (click)="toggleComplete(task)">
            {{ task.isCompleted ? 'Undo' : 'Complete' }}
          </button>

          <button class="edit"
                  (click)="startEdit(task)">
            Edit
          </button>

          <button class="danger"
                  (click)="deleteTask(task.id)">
            Delete
          </button>

          <button class="calendar-btn"
                  (click)="addToCalendar(task.id)">
            Add to Calendar
          </button>

        </div>

      }

    </div>

  }

</div>


<!-- FILTER BAR (OUTSIDE LOOP) -->

<div class="task-filter-bar">

  <button
    class="filter-btn"
    [class.active]="activeFilter === 'all'"
    (click)="filterBy('all')"
  >
    All
  </button>

  <button
    class="filter-btn"
    [class.active]="activeFilter === 'pending'"
    (click)="filterBy('pending')"
  >
    Pending
  </button>

  <button
    class="filter-btn"
    [class.active]="activeFilter === 'completed'"
    (click)="filterBy('completed')"
  >
    Completed
  </button>

  <button
    class="filter-btn"
    [class.active]="activeFilter === 'overdue'"
    (click)="filterBy('overdue')"
  >
    Overdue
  </button>

</div>


@if (recentlyDeletedTask) {
  <div class="undo-popup">
    Task deleted
    <button (click)="undoDelete()">Undo</button>
  </div>
}
