<div class="dialog-backdrop">

  <div class="dialog-box">

    <p>{{ message }}</p>

    <div class="actions">

      <button class="cancel-btn" (click)="cancel()">
        Cancel
      </button>

      <button class="confirm-btn" (click)="confirm()">
        Confirm
      </button>

    </div>

  </div>

</div>
